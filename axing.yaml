    type: vmess
    server: 175.27.154.104
    port: 6666
    uuid: fa16bc12-b6e5-4350-ca90-ccd3b03c0e46
    alterId: 0
    cipher: auto
    tls: false
    network: ws
    ws-opts:
      path: "/"
      headers: { Host: dm.toutiao.com }
    udp: true
    client-fingerprint: chrome
    dialer-proxy: "百度直连"       # 关键：强制家宽节点走百度直连链

