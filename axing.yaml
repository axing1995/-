# ==================== 全局设置 ====================
mixed-port: 7890
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: "https://ghproxy.net/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
find-process-mode: strict
keep-alive-interval: 30

geodata-mode: false
profile:
  store-selected: true
  store-fake-ip: true

# ==================== Sniffer ====================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP: { ports: [80, 8080-8880] }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.stun.*"
    - "+.time.*"
    - "+.ntp.*"

# ==================== TUN ====================
tun:
  enable: true
  stack: system
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  route-exclude-address: []

# ==================== DNS ====================
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "geosite:private"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "www.google.com"

  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver: ["https://120.53.53.53/dns-query", "https://223.5.5.5/dns-query"]
  proxy-server-nameserver: ["https://120.53.53.53/dns-query", "https://223.5.5.5/dns-query"]
  nameserver-policy:
    "rule-set:cn_domain,private_domain": ["https://120.53.53.53/dns-query", "https://223.5.5.5/dns-query"]
    "rule-set:geolocation-!cn": ["https://dns.cloudflare.com/dns-query", "https://dns.google/dns-query"]

# ==================== 策略组 ====================
proxy-groups:
  - {name: "国内选择", type: select, proxies: [百度直连], url: 'http://cp.cloudflare.com/generate_204', interval: 86400, icon: 'https://ghproxy.net/https://raw.githubusercontent.com/NB921/picture/main/China.png'}
  - {name: "百度直连", type: select, proxies: [彦祖分享-苏州联通, 彦祖分享-南京联通, 彦祖分享-保定联通, 彦祖分享-域名随缘, 彦祖分享-南京电信, 彦祖分享-江苏电信, 彦祖分享-北京电信, 彦祖分享-广州电信, 彦祖分享-广州移动, 彦祖分享-南京移动], icon: 'https://ghproxy.net/https://raw.githubusercontent.com/NB921/picture/main/Battle.png'}
  
  # UDP流量 首选家宽，家宽自身的 dialer-proxy 会将其 UDP over TCP 封装后穿入百度直连
  - {name: "UDP流量", type: select, proxies: [家宽节点1, 流量拦截, 百度直连], url: 'http://cp.cloudflare.com/generate_204', interval: 86400, icon: 'https://ghproxy.net/https://raw.githubusercontent.com/NB921/picture/main/hammer.png'}
  
  - {name: "端口受限", type: load-balance, proxies: [], filter: "", use: [彦祖公益], url: 'http://cp.cloudflare.com/generate_204', interval: 300, lazy: true, strategy: consistent-hashing, icon: 'https://ghproxy.net/https://raw.githubusercontent.com/NB921/picture/main/drive.png'}
  - {name: "国外选择", type: select, proxies: [故障转移, 节点选择], icon: 'https://ghproxy.net/https://raw.githubusercontent.com/NB921/picture/main/Golbal.png'}
  - {name: "节点选择", type: select, proxies: [], filter: "", use: [彦祖公益], icon: 'https://ghproxy.net/https://raw.githubusercontent.com/NB921/picture/main/coinspot.png'}
  - {name: "故障转移", type: fallback, proxies: [], filter: "", use: [彦祖公益], url: 'http://cp.cloudflare.com/generate_204', interval: 300, icon: 'https://ghproxy.net/https://raw.githubusercontent.com/NB921/picture/main/Health.png'}
  - {name: "漏网之鱼", type: select, proxies: [国内选择, 国外选择], icon: 'https://ghproxy.net/https://raw.githubusercontent.com/NB921/picture/main/Yu.png'}

# ==================== 规则 ====================
rules:
  - RULE-SET,private_ip,流量直连,no-resolve
  - NETWORK,UDP,UDP流量
  - DOMAIN-KEYWORD,xn--ngstr-lra8j.com,国内选择
  - DOMAIN-KEYWORD,services.googleapis.cn,国内选择
  - AND,((NETWORK,TCP),(DST-PORT,446/30443),(RULE-SET,cn_domain)),端口受限
  - AND,((NETWORK,TCP),(DST-PORT,446/30443),(RULE-SET,cn_ip)),端口受限
  - RULE-SET,twitter_domain,国外选择
  - RULE-SET,youtube_domain,国外选择
  - RULE-SET,google_domain,国外选择
  - RULE-SET,telegram_domain,国外选择
  - RULE-SET,google_ip,国外选择,no-resolve
  - RULE-SET,netflix_ip,国外选择,no-resolve
  - RULE-SET,telegram_ip,国外选择,no-resolve
  - RULE-SET,twitter_ip,国外选择,no-resolve
  - RULE-SET,geolocation-!cn,国外选择
  - RULE-SET,cn_domain,国内选择
  - RULE-SET,cn_ip,国内选择,no-resolve
  - MATCH,漏网之鱼

# ==================== 规则集 ====================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 百度直连}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs, proxy: 百度直连}

rule-providers:
  private_domain: { <<: *domain, url: "https://ghproxy.net/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs" }
